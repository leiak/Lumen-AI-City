x-prod-database-url: &prod-database-url "postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}"
x-prod-redis-world-engine-url: &prod-redis-world-engine-url "redis://world_engine:${REDIS_ACL_PASSWORD_WORLD_ENGINE:?set REDIS_ACL_PASSWORD_WORLD_ENGINE}@redis:6379/0"
x-prod-redis-agent-os-url: &prod-redis-agent-os-url "redis://agent_os:${REDIS_ACL_PASSWORD_AGENT_OS:?set REDIS_ACL_PASSWORD_AGENT_OS}@redis:6379/0"
x-prod-redis-api-gateway-url: &prod-redis-api-gateway-url "redis://api_gateway:${REDIS_ACL_PASSWORD_API_GATEWAY:?set REDIS_ACL_PASSWORD_API_GATEWAY}@redis:6379/0"
x-prod-redis-ws-gateway-url: &prod-redis-ws-gateway-url "redis://ws_gateway:${REDIS_ACL_PASSWORD_WS_GATEWAY:?set REDIS_ACL_PASSWORD_WS_GATEWAY}@redis:6379/0"
x-prod-redis-a2a-gateway-url: &prod-redis-a2a-gateway-url "redis://a2a_gateway:${REDIS_ACL_PASSWORD_A2A_GATEWAY:?set REDIS_ACL_PASSWORD_A2A_GATEWAY}@redis:6379/0"
x-prod-redis-economy-url: &prod-redis-economy-url "redis://economy:${REDIS_ACL_PASSWORD_ECONOMY:?set REDIS_ACL_PASSWORD_ECONOMY}@redis:6379/0"
x-prod-public-web-url: &prod-public-web-url "${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}"

services:
  migrate:
    image: postgres:16-alpine
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/migrate.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:?set POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:?set POSTGRES_DB}"
      PGSSLMODE: disable
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports: !override []
    volumes: !override
      - prod_pg_data:/var/lib/postgresql/data

  redis:
    command: ["sh", "/usr/local/bin/start-redis.sh"]
    environment:
      REDIS_ACL_PASSWORD_PROBE: "${REDIS_ACL_PASSWORD_PROBE:?set REDIS_ACL_PASSWORD_PROBE}"
      REDIS_ACL_PASSWORD_METRICS: "${REDIS_ACL_PASSWORD_METRICS:?set REDIS_ACL_PASSWORD_METRICS}"
      REDIS_ACL_PASSWORD_WORLD_ENGINE: "${REDIS_ACL_PASSWORD_WORLD_ENGINE:?set REDIS_ACL_PASSWORD_WORLD_ENGINE}"
      REDIS_ACL_PASSWORD_AGENT_OS: "${REDIS_ACL_PASSWORD_AGENT_OS:?set REDIS_ACL_PASSWORD_AGENT_OS}"
      REDIS_ACL_PASSWORD_API_GATEWAY: "${REDIS_ACL_PASSWORD_API_GATEWAY:?set REDIS_ACL_PASSWORD_API_GATEWAY}"
      REDIS_ACL_PASSWORD_WS_GATEWAY: "${REDIS_ACL_PASSWORD_WS_GATEWAY:?set REDIS_ACL_PASSWORD_WS_GATEWAY}"
      REDIS_ACL_PASSWORD_A2A_GATEWAY: "${REDIS_ACL_PASSWORD_A2A_GATEWAY:?set REDIS_ACL_PASSWORD_A2A_GATEWAY}"
      REDIS_ACL_PASSWORD_ECONOMY: "${REDIS_ACL_PASSWORD_ECONOMY:?set REDIS_ACL_PASSWORD_ECONOMY}"
      REDIS_MAXMEMORY: "${REDIS_MAXMEMORY:-512mb}"
      REDIS_MAXMEMORY_POLICY: "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    ports: !override []
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user probe --pass \"$$REDIS_ACL_PASSWORD_PROBE\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes: !override
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deploy/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
      - prod_redis_data:/data

  world-engine:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-world-engine-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-gateway:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-api-gateway-url
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CORS_ALLOWED_ORIGINS: *prod-public-web-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  a2a-gateway:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-a2a-gateway-url
      CITY_ID: "${CITY_ID:?set CITY_ID}"
      CROSS_CITY_INTERNAL_TOKEN: "${CROSS_CITY_SERVICE_TOKEN:?set CROSS_CITY_SERVICE_TOKEN}"
      OPERATOR_API_KEY: "${OPERATOR_API_KEY:?set OPERATOR_API_KEY}"
    ports: !override
      - "${A2A_HTTP_HOST_PORT:-8083}:8083"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ws-gateway:
    environment:
      REDIS_URL: *prod-redis-ws-gateway-url
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CORS_ALLOWED_ORIGINS: *prod-public-web-url
    ports: !override
      - "${WS_GATEWAY_HOST_PORT:-8082}:8082"

  web:
    build:
      args:
        NEXT_PUBLIC_API_GATEWAY: "${PUBLIC_API_GATEWAY_URL:?set PUBLIC_API_GATEWAY_URL}"
        NEXT_PUBLIC_WS_GATEWAY: "${PUBLIC_WS_GATEWAY_URL:?set PUBLIC_WS_GATEWAY_URL}"
        NEXT_PUBLIC_A2A_GATEWAY: "${PUBLIC_A2A_GATEWAY_URL:?set PUBLIC_A2A_GATEWAY_URL}"
    ports: !override []

  agent-os:
    environment:
      REDIS_URL: *prod-redis-agent-os-url
    ports: !override []

  economy-service:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-economy-url
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN}"
      CROSS_CITY_SERVICE_TOKEN: "${CROSS_CITY_SERVICE_TOKEN:?set CROSS_CITY_SERVICE_TOKEN}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-portal:
    environment:
      ADMIN_PORTAL_ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN}"
      ADMIN_PORTAL_JWT_SECRET: "${ADMIN_PORTAL_JWT_SECRET:?set ADMIN_PORTAL_JWT_SECRET}"
      DATABASE_URL: *prod-database-url
    ports: !override
      - "${ADMIN_PORTAL_HOST_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  milvus:
    ports: !override []
    environment:
      MINIO_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET_NAME: "${MILVUS_MINIO_BUCKET:?set MILVUS_MINIO_BUCKET}"

  etcd:
    ports: !override []

  minio:
    ports: !override []
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"

  kafka:
    ports: !override []

  redis-exporter:
    ports: !override []

  kafka-exporter:
    ports: !override []

  memory-service:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    ports: !override []

  saga-orchestrator:
    ports: !override []

  saga-worker:
    ports: !override []

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus-compose.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus-compose.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - api-gateway
      - world-engine
      - economy-service
      - redis-exporter
      - kafka-exporter
    profiles: ["observability"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    profiles: ["observability"]
    restart: unless-stopped

volumes:
  prod_pg_data:
  prod_redis_data:
  prometheus_data:
  grafana_data:
