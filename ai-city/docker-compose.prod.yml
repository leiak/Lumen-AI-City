x-prod-database-url: &prod-database-url "postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}"
x-prod-redis-url: &prod-redis-url "redis://redis:6379/0"
x-prod-public-web-url: &prod-public-web-url "${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}"

services:
  migrate:
    image: postgres:16-alpine
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/migrate.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:?set POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:?set POSTGRES_DB}"
      PGSSLMODE: disable
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: !override []
    volumes: !override
      - prod_pg_data:/var/lib/postgresql/data

  redis:
    ports: !override []
    volumes: !override
      - prod_redis_data:/data

  world-engine:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-gateway:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-url
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CORS_ALLOWED_ORIGINS: *prod-public-web-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  a2a-gateway:
    environment:
      DATABASE_URL: *prod-database-url
      CITY_ID: "${CITY_ID:?set CITY_ID}"
      CROSS_CITY_INTERNAL_TOKEN: "${CROSS_CITY_SERVICE_TOKEN:?set CROSS_CITY_SERVICE_TOKEN}"
    ports: !override
      - "${A2A_HTTP_HOST_PORT:-8083}:8083"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ws-gateway:
    environment:
      REDIS_URL: *prod-redis-url
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CORS_ALLOWED_ORIGINS: *prod-public-web-url
    ports: !override
      - "${WS_GATEWAY_HOST_PORT:-8082}:8082"

  web:
    build:
      args:
        NEXT_PUBLIC_API_GATEWAY: "${PUBLIC_API_GATEWAY_URL:?set PUBLIC_API_GATEWAY_URL}"
        NEXT_PUBLIC_WS_GATEWAY: "${PUBLIC_WS_GATEWAY_URL:?set PUBLIC_WS_GATEWAY_URL}"
    ports: !override
      - "${WEB_HOST_PORT:-3000}:3000"

  agent-os:
    environment:
      REDIS_URL: *prod-redis-url
    ports: !override []

  economy-service:
    environment:
      DATABASE_URL: *prod-database-url
      REDIS_URL: *prod-redis-url
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN}"
      CROSS_CITY_SERVICE_TOKEN: "${CROSS_CITY_SERVICE_TOKEN:?set CROSS_CITY_SERVICE_TOKEN}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-portal:
    environment:
      ADMIN_PORTAL_ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN}"
      ADMIN_PORTAL_JWT_SECRET: "${ADMIN_PORTAL_JWT_SECRET:?set ADMIN_PORTAL_JWT_SECRET}"
      DATABASE_URL: *prod-database-url
    ports: !override
      - "${ADMIN_PORTAL_HOST_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  milvus:
    ports: !override []

  etcd:
    ports: !override []

  minio:
    ports: !override []

  kafka:
    ports: !override []

  memory-service:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    ports: !override []

  saga-orchestrator:
    ports: !override []

  saga-worker:
    ports: !override []

volumes:
  prod_pg_data:
  prod_redis_data:
