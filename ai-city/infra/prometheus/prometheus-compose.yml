global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: aicity-api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: aicity-world-engine
    static_configs:
      - targets: ["world-engine:50052"]

  - job_name: aicity-economy-service
    static_configs:
      - targets: ["economy-service:8005"]

  - job_name: aicity-redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: aicity-kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
