groups:
  - name: aicity-p0
    interval: 30s
    rules:
      - alert: LLM_Daily_Budget_Exceeded
        expr: sum(llm_cost_usd_total) > 5000
        for: 1m
        labels:
          severity: p0
        annotations:
          summary: "LLM 日预算超限"
          description: "当日累计 Token 成本已超 $5,000，立即触发降级"

      - alert: SagaCompensationRate_High
        expr: rate(saga_compensated_total[5m]) / rate(saga_started_total[5m]) > 0.1
        for: 5m
        labels:
          severity: p0
        annotations:
          summary: "Saga 补偿率超过 10%"
          description: "可能存在下游服务不稳定"

      - alert: NPC_DecisionLoop
        expr: count by (agent_id) (rate(agent_decisions_total[5m])) > 5
        for: 2m
        labels:
          severity: p1
        annotations:
          summary: "NPC 决策陷入循环"
          description: "Agent {{ $labels.agent_id }} 5min 内决策超过 5 次/s，可能死循环"

      - alert: MemoryService_Latency_High
        expr: histogram_quantile(0.99, memory_recall_duration_ms_bucket) > 200
        for: 3m
        labels:
          severity: p1
        annotations:
          summary: "记忆检索 P99 > 200ms"
          description: "RAG 检索慢，影响 Agent 决策速度"

      - alert: FederationErrors_High
        expr: rate(federation_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: p1
        annotations:
          summary: "A2A 联邦错误率超 5%"
          description: "外部 Agent 接入异常"

  - name: aicity-production-core
    interval: 30s
    rules:
      - alert: APIGateway_5xx_Rate_High
        expr: |
          sum(rate(aicity_http_requests_total{status=~"5.."}[5m]))
            /
          sum(rate(aicity_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: p1
        annotations:
          summary: "API Gateway 5xx 率超过 5%"
          description: "过去 5 分钟核心 API 可用性异常"

      - alert: APIGateway_5xx_Budget_Breach
        expr: |
          sum(rate(aicity_http_requests_total{status=~"5.."}[10m]))
            /
          sum(rate(aicity_http_requests_total[10m])) > 0.001
        for: 10m
        labels:
          severity: p1
        annotations:
          summary: "API Gateway 5xx 错误预算 breached"
          description: "10 分钟 5xx 率超过 0.1%，M4 稳定性窗口失败"

      - alert: APIGateway_P95_Latency_Budget_Breach
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(aicity_http_request_duration_seconds_bucket[10m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: p1
        annotations:
          summary: "API Gateway P95 延迟预算 breached"
          description: "10 分钟 P95 超过 2 秒，M4 稳定性窗口失败"

      - alert: APIGateway_Latency_P99_High
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(aicity_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: p2
        annotations:
          summary: "API Gateway P99 延迟超过 1 秒"
          description: "玩家链路可能已经变慢"

      - alert: Critical_Action_Failure_Rate_High
        expr: |
          sum by (action) (rate(aicity_critical_action_total{result="failed"}[5m]))
            /
          sum by (action) (rate(aicity_critical_action_total[5m])) > 0.20
        for: 5m
        labels:
          severity: p1
        annotations:
          summary: "关键操作失败率超过 20%"
          description: "登录、转账、购买或提现链路出现异常"

      - alert: EconomyService_5xx_Rate_High
        expr: |
          sum(rate(economy_http_requests_total{status=~"5.."}[5m]))
            /
          sum(rate(economy_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: p1
        annotations:
          summary: "Economy Service 5xx 率超过 5%"
          description: "钱包、购买或创作者收益链路可能异常"

      - alert: Rate_Limited_Auth_Or_Money_Burst
        expr: sum(rate(aicity_rate_limit_rejected_total{scope=~"auth|money"}[5m])) > 1
        for: 5m
        labels:
          severity: p2
        annotations:
          summary: "认证或资金操作限流持续触发"
          description: "可能存在暴力尝试或异常客户端"

  - name: aicity-redis-production
    interval: 30s
    rules:
      - alert: Redis_Down
        expr: up{job="aicity-redis"} == 0
        for: 1m
        labels:
          severity: p0
        annotations:
          summary: "Redis exporter 无法抓取"
          description: "玩家移动、NPC 流式对话或限流链路可能中断"

      - alert: Redis_Memory_Usage_High
        expr: |
          redis_memory_used_bytes{job="aicity-redis"}
            /
          redis_memory_max_bytes{job="aicity-redis"} > 0.90
          and redis_memory_max_bytes{job="aicity-redis"} > 0
        for: 10m
        labels:
          severity: p1
        annotations:
          summary: "Redis 内存使用超过 90%"
          description: "缓存和限流状态可能开始被驱逐"

      - alert: Redis_Evictions_Increasing
        expr: increase(redis_evicted_keys_total{job="aicity-redis"}[15m]) > 0
        for: 5m
        labels:
          severity: p1
        annotations:
          summary: "Redis 最近 15 分钟发生 key 驱逐"
          description: "maxmemory 过低或 TTL 策略异常"

      - alert: Redis_Rejected_Connections
        expr: increase(redis_rejected_connections_total{job="aicity-redis"}[5m]) > 0
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "Redis 拒绝新连接"
          description: "连接数或系统资源已达上限"

      - alert: Redis_Slowlog_Growing
        expr: increase(redis_slowlog_length{job="aicity-redis"}[10m]) > 0
        for: 5m
        labels:
          severity: p2
        annotations:
          summary: "Redis slowlog 持续增长"
          description: "存在超过 10ms 的命令，需检查热 key 或大负载"

  - name: aicity-kafka-production
    interval: 30s
    rules:
      - alert: Kafka_Broker_Down
        expr: up{job="aicity-kafka"} == 0 or absent(kafka_brokers)
        for: 1m
        labels:
          severity: p0
        annotations:
          summary: "Kafka exporter 或 broker 不可用"
          description: "购买事务、Saga 执行或跨城结算事件可能无法发布"

      - alert: Kafka_Consumer_Lag_High
        expr: max(kafka_consumergroup_lag{job="aicity-kafka"}) > 1000
        for: 5m
        labels:
          severity: p1
        annotations:
          summary: "Kafka consumer lag 超过 1000"
          description: "Saga 或经济事件消费速度不足，需要扩容消费者"

      - alert: Economy_Kafka_Send_Failed
        expr: increase(economy_kafka_send_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "Economy Kafka 发送失败"
          description: "Topic {{ $labels.topic }} 5 分钟内出现发布失败，请检查 broker 与网络"
