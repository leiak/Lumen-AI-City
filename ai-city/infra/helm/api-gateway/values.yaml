replicaCount: 3

image:
  repository: ghcr.io/aicity/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

env:
  REDIS_URL: "redis://aicity-redis:6379/0"
  JWT_SECRET: "REPLACE_FROM_SECRET_MANAGER"
  LOG_LEVEL: "info"
