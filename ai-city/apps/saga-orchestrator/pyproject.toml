[project]
name = "saga-orchestrator"
version = "0.1.0"
description = "Saga 分布式事务编排器（含补偿、Dashboard）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "aiokafka>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
