[package]
name = "world-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Sprint 1 使用内存 WorldGrid；Sprint 2 引入 sqlx 做 PG 持久化
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
# Sprint 2: 从 PG `tile` 表加载世界数据
# 手写极简 PG Simple Query 客户端（src/tile_loader.rs::pg_client）—— 与 redis_pub 同思路
# 避免 sqlx 拉入 rustls / ring / parking_lot 等 native 链（Windows 1.82 + GNU 无 gcc/dlltool 编译不过）
# Sprint 2: Prometheus /metrics（手写 text format，无额外依赖）
# Redis Pub/Sub: 用 tokio TCP 直写 RESP，避免 redis-rs 拉入大依赖链
# 仅支持 PUBLISH；订阅由 api-gateway 用 go-redis 处理

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "world-engine"
path = "src/main.rs"

[lib]
name = "world_core"
path = "src/lib.rs"
