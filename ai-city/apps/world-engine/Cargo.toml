[package]
name = "world-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bin]]
name = "world-engine"
path = "src/main.rs"

[lib]
name = "world_core"
path = "src/lib.rs"
