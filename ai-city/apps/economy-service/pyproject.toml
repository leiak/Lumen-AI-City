[project]
name = "economy-service"
version = "0.1.0"
description = "经济系统（虚拟货币 / 结算 / 创作者分成）"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
