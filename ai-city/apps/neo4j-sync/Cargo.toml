[package]
name = "neo4j-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
neo4rs = "0.8"
rdkafka = { version = "0.36", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[bin]
name = "neo4j-sync"
path = "src/main.rs"
