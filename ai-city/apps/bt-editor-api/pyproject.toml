[project]
name = "bt-editor-api"
version = "0.1.0"
description = "BT 编辑器后端（校验 / 沙箱 / 版本管理）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
