[project]
name = "bt-editor-api"
version = "0.1.0"
description = "BT 编辑器后端（校验 / 沙箱 / 版本管理）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "jsonschema>=4.23",
    "httpx>=0.27",
    # Phase C.2 — reuse the C.1 BT runtime (load_tree, evaluator.tick,
    # Pydantic discriminated union) instead of re-implementing the schema.
    "agent-os",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
]

[tool.uv.sources]
# Workspace member: same monorepo, so the C.1 BT runtime we depend on
# for validation + simulate is the local editable install, not PyPI.
agent-os = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
