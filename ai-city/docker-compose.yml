# ============================================
# AI City - 全栈 Compose 工程 aitown
# ============================================
# 用法: docker compose up -d --build
#
# 八个容器：postgres + redis + world-engine + api-gateway + a2a-gateway
#           + ws-gateway + web + agent-os
# schema 由 postgres 的 /docker-entrypoint-initdb.d 自动初始化（仅数据卷为空时）。
# 原生 .exe 跑法已废弃，容器是唯一入口。

name: aitown

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicity
      POSTGRES_PASSWORD: aicity_dev
      POSTGRES_DB: aicity
      # dev-only：world-engine 的手写 PG wire 客户端（src/pg_client.rs:107）
      # 只支持 trust，收到任何非 0 的 AuthenticationRequest 就 bail。
      # 5432 只发布到 127.0.0.1，不暴露到局域网。
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 按文件名字母序执行：02 依赖 01 建的 npc / tile 表
      - ./packages/proto/pg-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/seed-npcs.sql:/docker-entrypoint-initdb.d/02-seed-npcs.sql:ro
      # 2.0：跨城联邦路由表 + 心跳表 + memory player_session 表
      - ./packages/proto/pg-schema-2.0.sql:/docker-entrypoint-initdb.d/03-schema-2.0.sql:ro
      # Phase C.2：BT editor 后端持久化（bt_tree 表 + version bump 触发器）
      - ./packages/proto/pg-schema-2.0-bt-editor.sql:/docker-entrypoint-initdb.d/04-bt-editor.sql:ro
      # Phase C.4：BT editor admin auth（player.role 列 + 索引 + pgcrypto guard）
      - ./packages/proto/pg-schema-2.0-bt-auth.sql:/docker-entrypoint-initdb.d/05-bt-auth.sql:ro
      # Phase C.4：admin / adminpass seed（依赖 05 的 role 列）
      - ./db/seed/seed-admin.sql:/docker-entrypoint-initdb.d/06-seed-admin.sql:ro
      # Phase 3.0: Economy system — wallet + transaction + product + central_bank_ledger
      - ./packages/proto/pg-schema-3.0-economy.sql:/docker-entrypoint-initdb.d/07-economy.sql:ro
      # Phase 3.0: demo / admin 钱包种子（1000 gold + 100 token，幂等）
      - ./db/seed/seed-economy.sql:/docker-entrypoint-initdb.d/08-seed-economy.sql:ro
      # Phase 3.0 v3: 创作者市场模板/购买/分成表
      - ./packages/proto/pg-schema-3.0-creator-market.sql:/docker-entrypoint-initdb.d/09-creator-market.sql:ro
      # Phase 3.0 v3: creator demo 身份与钱包种子
      - ./db/seed/seed-creator-market.sql:/docker-entrypoint-initdb.d/10-seed-creator-market.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicity']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  world-engine:
    build:
      context: .
      dockerfile: apps/world-engine/Dockerfile
    ports:
      - '50051:50051'   # gRPC
      - '50052:50052'   # REST
    environment:
      DATABASE_URL: postgresql://aicity:aicity_dev@postgres:5432/aicity
      REDIS_URL: redis://redis:6379/0
      REDIS_CHANNEL_MOVED: aicity:player:moved
      RUST_LOG: info
      # WORLD_GRPC_ADDR / WORLD_BIND_ADDR 默认已是 0.0.0.0，不覆盖
      # 2.0 阶段 1：mTLS 路径，scripts/gen-mtls-certs.sh 生成；
      # city_a 实例用 -a 证书；city_b 留给 Task 54。
      GRPC_TLS_CERT: /etc/world-engine/certs/world-engine-a.crt
      GRPC_TLS_KEY: /etc/world-engine/certs/world-engine-a.key
      GRPC_TLS_CA: /etc/world-engine/certs/aicity-ca.crt
    volumes:
      # 2.0：mTLS 证书只读挂载；:ro 防止容器内误改 host 上的私钥
      - ./certs:/etc/world-engine/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 故意用 /readyz 而非 /healthz：它校验 pg_connected（src/rest.rs:100），
      # 能在 up 阶段就把 trust 认证是否生效暴露成 unhealthy。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:50052/readyz']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - '${API_GATEWAY_HOST_PORT:-8080}:8080'
    environment:
      API_GATEWAY_PORT: '8080'
      DATABASE_URL: postgresql://aicity:aicity_dev@postgres:5432/aicity
      REDIS_URL: redis://redis:6379/0
      WORLD_ENGINE_URL: http://world-engine:50052
      WORLD_ENGINE_GRPC_ADDR: world-engine:50051
      JWT_SECRET: dev-secret-change-me
      # 浏览器从 web(:3000) 跨源调本服务(:8080)，必须放通该 origin，
      # 否则登录响应被浏览器丢弃（curl 看不出问题）
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      # Sprint 12：/v1/npc/talk 用 talk_tree（api-gateway 侧 lookup），
      # 目录与 agent-os 共享同一份 bind mount，保证两边看到的 NPC 一致。
      NPC_CONFIG_DIR: /etc/aicity/npc-templates
      # Sprint 12：与 agent-os 保持同一频道名（main.go:117 写死，但留 env
      # 槽位便于以后从 env 取）。当前 agent-os 默认值 = aicity:npc_dialogue。
      REDIS_CHANNEL_NPC_DIALOGUE: aicity:npc_dialogue
      # 2.0 阶段 1：mTLS 路径，scripts/gen-mtls-certs.sh 生成；
      # city_a 用 -a 证书；city_b 留给 Task 54 跨城联邦轨道。
      GRPC_TLS_CERT: /etc/api-gateway/certs/api-gateway-a.crt
      GRPC_TLS_KEY: /etc/api-gateway/certs/api-gateway-a.key
      GRPC_TLS_CA: /etc/api-gateway/certs/aicity-ca.crt
    volumes:
      # 同一份模板 mount 进 agent-os 和 api-gateway；:ro 防容器内误改 host。
      - ./packages/npc-templates:/etc/aicity/npc-templates:ro
      # 2.0：mTLS 证书只读挂载；私钥在 host 上不归容器写。
      - ./certs:/etc/api-gateway/certs:ro
    depends_on:
      # 启动期硬依赖：worldgrpc.NewClient 用 grpc.WithBlock() + 5s 超时，
      # 失败即 logger.Fatal（cmd/main.go:81）。PG / Redis ping 同样 fatal。
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      world-engine:
        condition: service_healthy
    healthcheck:
      # 注意：不在 /v1 下，且没有 /readyz
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  a2a-gateway:
    build:
      context: .
      dockerfile: apps/a2a-gateway/Dockerfile
    ports:
      - '50061:50061'   # gRPC
      - '8083:8083'     # HTTP
    environment:
      # 必须覆盖：cmd/main.go:42 默认绑 127.0.0.1，容器里端口映射打不通
      A2A_GRPC_ADDR: 0.0.0.0:50061
      A2A_HTTP_ADDR: 0.0.0.0:8083
      DATABASE_URL: postgresql://aicity:aicity_dev@postgres:5432/aicity
      A2A_REPLAY_WINDOW_SEC: '300'
      A2A_INBOX_TTL_HOURS: '168'
      A2A_INBOX_CLEANUP_INTERVAL_SEC: '300'
      # 2.0 阶段 1：mTLS 路径，scripts/gen-mtls-certs.sh 生成。
      # a2a 联邦需要服务端证书 + 验客户端证书，所以分 TLS_CA / CLIENT_CA 两槽位。
      TLS_CERT: /etc/a2a/certs/a2a-gateway.crt
      TLS_KEY: /etc/a2a/certs/a2a-gateway.key
      TLS_CA: /etc/a2a/certs/aicity-ca.crt
      CLIENT_CA: /etc/a2a/certs/aicity-ca.crt
      # 2.0 阶段 1：跨城 NPC 路由表（cmd/main.go:52 默认 data/a2a-routing-table.yaml，
      # 必须用 env 显式覆盖 + mount 到 /app/data/，否则容器内启动直接 fatal）
      A2A_ROUTING_TABLE: /app/data/a2a-routing-table.yaml
      # 3.0 v2：跨城金币本地经济与远端 A2A RPC 接线。
      CITY_ID: city_a
      ECONOMY_SERVICE_URL: http://economy-service:8005
      CROSS_CITY_INTERNAL_TOKEN: "${CROSS_CITY_SERVICE_TOKEN:-dev-cross-city-service-token}"
      CROSS_CITY_RESERVATION_TTL: 10m
    volumes:
      # 2.0：mTLS 证书只读挂载；私钥不在容器内落盘，host 上也不归容器写。
      - ./certs:/etc/a2a/certs:ro
      # 2.0：跨城路由表只读挂载（10 NPC = city_a × 5 + city_b × 5）
      - ./data/a2a-routing-table.yaml:/app/data/a2a-routing-table.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /v1/healthz 已 auth-bypass（internal/httpgw/router.go:105）
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8083/v1/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ws-gateway:
    build:
      context: .
      dockerfile: apps/ws-gateway/Dockerfile
    ports:
      - '8082:8082'
    environment:
      WS_GATEWAY_PORT: '8082'
      REDIS_URL: redis://redis:6379/0
      # 必须与 world-engine 的 REDIS_CHANNEL_MOVED 一致，否则订阅不到事件
      REDIS_CHANNEL_MOVED: aicity:player:moved
      # 必须与 api-gateway 的 JWT_SECRET 一致，否则登录签发的 token 在这里验不过
      JWT_SECRET: dev-secret-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
    depends_on:
      # Redis ping 失败即 logger.Fatal，必须等 healthy
      redis:
        condition: service_healthy
      # 只为让 JWT_SECRET 生效顺序直观；不卡 healthy，避免启动链过长
      api-gateway:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8082/readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_* 是 build-time inline（web/next.config.js 的 env: 块），
        # 且由浏览器端代码消费 → 必须是 host 可达 URL，不能用 compose 服务名。
        NEXT_PUBLIC_API_GATEWAY: http://localhost:8080
        NEXT_PUBLIC_WS_GATEWAY: ws://localhost:8082/ws
    ports:
      - '3000:3000'
    depends_on:
      # web 全是客户端渲染，无 SSR 取数，不需要 gate 在 healthy 上
      api-gateway:
        condition: service_started
    restart: unless-stopped

  agent-os:
    # Sprint 12：NPC 主动说（active say）服务。FastAPI + lifespan 启 SayScheduler
    # 后台 asyncio.Task，每 SAY_TICK_SECONDS 触发一轮 npc.Say()。
    build:
      context: .
      dockerfile: apps/agent-os/Dockerfile
    container_name: agent-os
    ports:
      - '8084:8084'
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_CHANNEL_NPC_DIALOGUE: aicity:npc_dialogue
      # 2.0 stage 2：NpcSayPublisher 发流频道；与 ws-gateway 多频道订阅对齐。
      # publisher.py 当前仍用常量 CHANNEL_SAY_STREAM，未来可在 settings 覆盖。
      REDIS_CHANNEL_NPC_SAY_STREAM: aicity:npc:say_stream
      NPC_TEMPLATES_DIR: /etc/aicity/npc-templates
      HTTP_PORT: '8084'
      # 小写 OK —— main.py:13 已 normalize 为 'INFO' 给 stdlib logging，'info' 给 uvicorn
      LOG_LEVEL: info
      SERVICE_NAME: agent-os
      SAY_TICK_SECONDS: '5.0'
      # 2.0 阶段 1：mTLS 路径，scripts/gen-mtls-certs.sh 生成；
      # city_a 用 -a 证书；city_b 留给 Task 54。
      GRPC_TLS_CERT: /etc/agent-os/certs/agent-os-a.crt
      GRPC_TLS_KEY: /etc/agent-os/certs/agent-os-a.key
      GRPC_TLS_CA: /etc/agent-os/certs/aicity-ca.crt
    volumes:
      # 与 api-gateway 共用同一份 bind mount；:ro 保护 host 源文件。
      - ./packages/npc-templates:/etc/aicity/npc-templates:ro
      # 2.0：mTLS 证书只读挂载；私钥在 host 上不归容器写。
      - ./certs:/etc/agent-os/certs:ro
    depends_on:
      # SayScheduler 启动后第一轮 tick 就会 publish，没 redis 就直接抛。
      # Redis ping 仅 best-effort（app.py:62），但 publish 是 hot path。
      redis:
        condition: service_healthy
      # 不强制 healthy：api-gateway 不卡 ws-gateway 健康，同理这里也不卡。
      api-gateway:
        condition: service_started
    healthcheck:
      # /healthz 不依赖 redis 真活着（app.py:82）—— 只看进程是否在 listen。
      # 用 wget 而非 curl：镜像走 python:3.12-slim 不带 curl，wget 在 busybox。
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/healthz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 3.0 阶段 1：经济系统（虚拟货币 / 结算 / 创作者分成）。
  # FastAPI + lifespan 启中央银行 emit scheduler (apps/economy-service/src/economy_service/app.py:20)。
  # 端口 8005（与 web/api-gateway/a2a/ws/agent-os 均无冲突）。
  economy-service:
    build:
      context: .
      dockerfile: apps/economy-service/Dockerfile
    container_name: aicity-economy-service
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://aicity:aicity_dev@postgres:5432/aicity
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 与 api/v1/admin.py:12 默认值一致；admin 路由验签用 secrets.compare_digest
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
      # 与 a2a-gateway 的 CROSS_CITY_INTERNAL_TOKEN 使用同一令牌
      CROSS_CITY_SERVICE_TOKEN: "${CROSS_CITY_SERVICE_TOKEN:-dev-cross-city-service-token}"
      # marketplace 路由复用 api-gateway 的 HS256 JWT secret
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      # scheduler.py:12 默认 6 小时一轮中央银行 emit；env 可覆盖
      EMIT_INTERVAL_HOURS: "${EMIT_INTERVAL_HOURS:-6}"
      PYTHONUNBUFFERED: "1"
    depends_on:
      # wallet/product/transaction 表依赖 PG schema-07 + seed-economy.sql 已生效
      postgres:
        condition: service_healthy
      # redis_client.py:8 启动即 PING；wallet/purchase 都走 redis 缓存余额
      redis:
        condition: service_healthy
      # Kafka producer 启动 best-effort（kafka_producer.py:60 失败不致命），
      # 用 service_started 即可——和 saga-orchestrator 一致。
      kafka:
        condition: service_started
    healthcheck:
      # /health 不依赖 PG/Redis 真实活着（app.py:43 仅返 {"status":"ok"}）；
      # 与 agent-os 同款 wget 调用，保证 economy-service 进程在 listen。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 3.0 v2：admin-portal 运营后台（Next.js 15）— wallet / transactions / admin
  # 代理 economy-service。端口 8081（与 web/api-gateway/a2a/ws/agent-os/
  # economy-service 均无冲突）。
  # ADMIN_PORTAL_* env 在 src/lib/economy.ts 读取（proxyGet/proxyPost +
  # requireAdmin）；DATABASE_URL 给 /api/players 直连 PG 拉 demo + admin 玩家
  # （apps/admin-portal/src/app/api/players/route.ts:43）。
  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    container_name: admin-portal
    ports:
      - "8081:8081"
    environment:
      # 必须用 compose 服务名 + 端口（浏览器侧用 localhost:8005，agent-os 同款）
      ADMIN_PORTAL_ECONOMY_URL: "http://economy-service:8005"
      # 与 economy-service 共用 ADMIN_TOKEN；二者密钥一致即可通过 Bearer 校验
      # （economy-service/api/v1/admin.py:12 默认 dev-admin-token）
      ADMIN_PORTAL_ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
      # 与 api-gateway/ws-gateway 共用 JWT_SECRET 同源，登录 cookie 才能验签
      ADMIN_PORTAL_JWT_SECRET: "${ADMIN_PORTAL_JWT_SECRET:-dev-secret-change-me}"
      # /api/players 直连 PG（player 表）；其他 API 路由只走 economy-service
      DATABASE_URL: "postgresql://aicity:aicity_dev@postgres:5432/aicity"
    depends_on:
      # proxyGet/proxyPost 启动期不硬验（运行时 fallback 到 502），started 就够
      economy-service:
        condition: service_started
      # /api/players 用 pg.Client.connect() 同步阻塞，PG schema 未就绪直接 500
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 2.0 阶段 1：向量数据库（memory-service long-term recall 用）。
  # standalone 模式 = Milvus 主 + 独立 etcd（meta）+ 独立 minio（blob）。
  # ADR-0007 锁定 Milvus 2.4；端口 19530（gRPC）/ 9091（metrics+health）。
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - '19530:19530'
      - '9091:9091'
    depends_on:
      - etcd
      - minio
    healthcheck:
      # milvusdb/milvus 镜像基于 Ubuntu，自带 curl（不同于本仓库 alpine busybox）。
      # 9091/healthz 端点由 milvus 内置；返回 body 含 "OK"。
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - milvus_data:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    volumes:
      - etcd_data:/etcd
    command: ['etcd', '-advertise-client-urls=http://etcd:2379', '-listen-client-urls=http://0.0.0.0:2379', '--data-dir=/etcd']

  minio:
    image: minio/minio:RELEASE.2023-09-20T20-32-50Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: ['minio', 'server', '/minio_data']

  # 2.0 阶段 1：Kafka 3.7 Kraft 模式（无 Zookeeper）
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    restart: unless-stopped

  # 2.0 阶段 1：memory-service 骨架（FastAPI + /healthz）。
  # 后续 week 1 day 4 接 Milvus + PG，加 /readyz 真实探针。
  memory-service:
    build: ./apps/memory-service
    container_name: memory-service
    ports:
      - "9200:9200"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      POSTGRES_HOST: postgres
      POSTGRES_DB: aicity
      POSTGRES_USER: aicity
      POSTGRES_PASSWORD: aicity_dev
    depends_on:
      - milvus
      - postgres
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 2.0 阶段 1：saga-orchestrator 骨架（Gin + /healthz）。
  # 后续接入 Kafka 事件流 + 状态机。
  saga-orchestrator:
    build: ./apps/saga-orchestrator
    container_name: saga-orchestrator
    ports:
      - "9100:9100"
    environment:
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
    depends_on:
      - kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2.0 阶段 1：saga-worker 骨架（FastAPI + /healthz + Kafka topic 订阅配置）。
  # 后续 Phase 4 Task 34 接入 Kafka 消费者循环。
  saga-worker:
    build: ./apps/saga-worker
    container_name: saga-worker
    ports:
      - "9101:9101"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: saga.npc.action
      KAFKA_GROUP: saga-worker-group
      SAGA_ORCHESTRATOR_URL: http://saga-orchestrator:9100
      WORKER_ID: worker-1
    depends_on:
      - kafka
      - saga-orchestrator
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  milvus_data:
  etcd_data:
  minio_data:
