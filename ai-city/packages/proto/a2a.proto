syntax = "proto3";

package aicity.a2a.v1;

option go_package = "github.com/aicity/proto/gen/go/a2a/v1;a2av1";

// A2A 联邦协议（§20）
service A2AGateway {
  // Agent Card 注册
  rpc RegisterCard(AgentCard) returns (RegisterResponse);

  // 联邦发现
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);

  // 发送消息
  rpc SendMessage(Message) returns (MessageResponse);

  // 双向流（用于对话）
  rpc Stream(stream Message) returns (stream Message);

  // Sprint 7：拉取 a2a_inbox（store-and-forward）
  rpc FetchInbox(FetchInboxRequest) returns (FetchInboxResponse);
}

message AgentCard {
  string agent_id = 1;
  string name = 2;
  string description = 3;
  string url = 4;
  string provider = 5;          // "openclaw" | "workbuddy" | "aicity"
  string version = 6;
  repeated string capabilities = 7;
  map<string, string> auth = 8; // "ed25519:..." | "mtls:..."
  int64 registered_at_ms = 9;
  // Sprint 8：所属城邦 ID。空 = 不限（旧 card 默认值）。
  // Discover 的 city_filter 按本字段过滤；ACL deny 按 peer 的 city_id 判定。
  string city_id = 10;
}

message RegisterResponse {
  bool accepted = 1;
  string card_id = 2;
}

message DiscoverRequest {
  string capability = 1;
  string city_filter = 2;
}

message DiscoverResponse {
  repeated AgentCard cards = 1;
}

// Envelope（§20.3）
message Message {
  string message_id = 1;
  string from_agent_id = 2;
  string to_agent_id = 3;
  string conversation_id = 4;
  string type = 5;             // "request" | "response" | "event"
  bytes payload = 6;           // 实际业务数据
  int64 ts_ms = 7;
  string trace_id = 8;
  string signature = 9;        // ed25519 签名（§20.11）
}

message MessageResponse {
  bool delivered = 1;
  string error = 2;
}

// Sprint 7：收件方拉取 store-and-forward inbox。
message FetchInboxRequest {
  string agent_id = 1;          // 收件方（= 注册到 a2a_agent_card 的 agent_id）
  int32  limit = 2;             // 默认 50，最大 500
  string cursor = 3;            // 增量：上一批返回的 next_cursor（= queued_at RFC3339Nano）
  bool   mark_read = 4;         // true = 拉取即标已读
}

message FetchInboxResponse {
  repeated Message messages = 1;   // 与 a2av1.Message 同构（8 字段 + signature）
  string next_cursor = 2;          // 空 = 拉完；非空 = 还有
}
