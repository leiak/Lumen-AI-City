syntax = "proto3";

package aicity.memory.v1;

option go_package = "github.com/aicity/proto/gen/go/memory/v1;memoryv1";

service MemoryService {
  rpc Remember(RememberRequest) returns (RememberResponse);
  rpc Recall(RecallRequest) returns (RecallResponse);
  rpc Forget(ForgetRequest) returns (ForgetResponse);
}

message MemoryItem {
  string id = 1;
  string agent_id = 2;
  string content = 3;
  int32 importance = 4;     // 1-5
  int64 created_at_ms = 5;
  string layer = 6;        // "sensory" | "episodic" | "semantic"
}

message RememberRequest {
  string agent_id = 1;
  string content = 2;
  int32 importance = 3;
  map<string, string> metadata = 4;
}

message RememberResponse {
  string id = 1;
  string layer = 2;
}

message RecallRequest {
  string agent_id = 1;
  string query = 2;
  int32 top_k = 3;
  string layer_filter = 4;  // "" 表示全部
}

message RecallResponse {
  repeated MemoryItem items = 1;
  repeated float scores = 2;
}

message ForgetRequest {
  string agent_id = 1;
  string memory_id = 2;
}
