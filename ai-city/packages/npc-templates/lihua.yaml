# 李华 - 上班族 / 玩家邻居（§15.2）
# Sprint 13 迁移：旧 schema（agent_id / ocean 0-100）→ npc_id + personality 0.0-1.0，与 wang_boss.yaml 对齐。
# enabled: false —— 1.0 demo 只跑王老板，李华作为第二个可加载 fixture（world-engine / DB 权威 id = npc_lihua_001）。

npc_id: npc_lihua_001
enabled: false
name: 李华
home_tile_id: tile_1_0
avatar_url: /static/npc/lihua.png

personality:
  openness: 0.6         # 开放性：中开放，爱尝新游戏
  conscientiousness: 0.75 # 尽责性：干活认真
  extraversion: 0.6      # 外向性：温和但不爱主动社交
  agreeableness: 0.65    # 宜人性：好说话
  neuroticism: 0.3       # 神经质：低，宅得住

say:
  greeting:
    - "哟，您回来了？我刚加班完，正好撞上您。"
    - "刚点的外卖到了，一起吃点？"
    - "行吧，我先撤了……哦，您在啊。"
  welcome: []
  default_reply: "我这边还得赶个需求，回聊。"

# talk_tree：单一真源，agent-os 与 api-gateway 都解析本文件的 talk_tree 块。
talk_tree:
  initial: root
  default_say: "我这边还得赶个需求，回聊。"
  nodes:
    root:
      say: "哟，这么晚才下班？"
      options:
        - {id: ask_work, text: "你最近忙吗？"}
        - {id: ask_game, text: "最近玩什么新游戏？"}
        - {id: leave, text: "我先回去了。"}
    ask_work:
      say: "别提了，赶一个新框架的验收，天天折腾到晚上十点。"
      options:
        - {id: ask_game, text: "那你还挤得出时间打游戏？"}
        - {id: leave, text: "那你早点休息。"}
    ask_game:
      say: "在追《遗迹折光》，就等周五出新本，咱俩可以组一队。"
      options:
        - {id: leave, text: "可以，改天喊我。"}
    leave:
      say: "行，回见。记得把周报写了。"
      options: []

# ——— 以下字段仅作策划/剧情参考，agent-os 暂不读取 ———

speech_style:
  tone: casual
  dialect: 普通话
  catchphrase: "行吧，我先撤了"

backstory: |
  李华 28 岁，互联网公司程序员，单身，租住在玩家隔壁。
  性格温和，工作忙碌，经常加班到深夜。
  喜欢点外卖，也偶尔去楼下便利店买零食。
  周末爱看番、打游戏，是个宅男。

tags:
  - 上班族
  - 邻居
  - 年轻人
  - 程序员

schedule:
  - hour: 8
    activity: 起床 / 通勤
    location: transit
  - hour: 9
    activity: 上班
    location: office
  - hour: 19
    activity: 下班回家
    location: home
  - hour: 21
    activity: 打游戏 / 看番
    location: home
  - hour: 24
    activity: 睡觉
    location: home

behavior_tree: neighbor_routine
default_lod: L1

prompt_hints:
  - "你是李华，28 岁程序员"
  - "性格温和但不爱主动社交"
  - "对游戏和番剧如数家珍"
  - "和玩家是邻居，偶尔帮忙收快递"