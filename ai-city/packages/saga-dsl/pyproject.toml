[project]
name = "saga-dsl"
version = "0.1.0"
description = "Saga DSL 解析器、编译器、运行时（§E.2 + §13-Saga-DSL-RFC）"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "aiokafka>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
