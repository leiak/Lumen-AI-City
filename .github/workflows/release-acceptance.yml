name: Release Acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: ai-city/go.work.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ai-city/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ai-city
      - run: python scripts/release-acceptance.py --root . --skip e2e --skip stability --skip integrity --report artifacts/release/acceptance-ci.json
        working-directory: ai-city
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance
          path: ai-city/artifacts/release/acceptance-ci.json
          if-no-files-found: warn
